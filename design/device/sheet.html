<style>

  .stiles{position:absolute;left:6px;right:6px;top:20px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .stile{height:30px;background:#1B3038;border:1px solid #23444E;border-radius:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
  .stile svg{width:10px;height:10px;stroke:#6FF2C0;fill:none;stroke-width:1.8}
  .stile span{font-size:5.4px;color:#CFE7EB}
  .stile.on{background:#6FF2C0;border-color:#6FF2C0}
  .stile.on svg{stroke:#08201A}
  .stile.on span{color:#08201A;font-weight:700}
  .sfoot{position:absolute;left:8px;right:8px;bottom:4px;display:flex;font-size:5px;color:#6F8D95}
</style></head>
