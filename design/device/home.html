<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>Home</title><link rel="stylesheet" href="device.css"></head>
<body>
<div class="dev"><div class="screen">

  <!-- rail -->
  <div class="rail">

    <div class="ritem">

      <span>游戏</span>
    </div>
    <div class="ritem">
      <svg viewBox="0 0 24 24"><path d="M14 6a4 4 0 0 0-4 6l-6 6 2 2 6-6a4 4 0 0 0 6-4l-3 1-2-2z"/></svg>
      <span>工具</span>
    </div>
    <div class="ritem">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/><circle cx="18" cy="17" r="2"/></svg>

    </div>
    <div class="ritem">

  <div style="position:absolute;left:46px;right:6px;top:3px;height:9px;display:flex;align-items:center;font-size:5.2px;color:#6F8D95">
    <span>周一 · 10/17</span>

      <span class="chip">SD 6.2G</span><span class="chip" style="color:#6FF2C0;border-color:#2C5A4A">RTC</span>
    </span>
  </div>

  <!-- hero -->
  <div class="hero" style="top:16px;height:50px">
    <div class="glow"></div>
    <div class="k">继续游玩 · 2 天前</div>
    <div class="t">MOTHER 3</div>
    <div class="m">GBA · 32 MiB · 存档 3 · 已打补丁</div>
    <div class="bar"><i></i></div>
    <div class="cta"><span style="font:6px/1 Consolas,monospace;background:#08201A;color:#6FF2C0;padding:1px 2px;border-radius:1px">A</span>继续</div>
  </div>

  <div class="sec" style="top:70px">最近游玩</div>

  <div class="rec sel" style="top:77px">
    <div class="ic"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M8 8h8M8 12h8"/></svg></div>
    <div class="n">METROID.ZERO.MISSION</div>
    <div class="s">8M</div>
  </div>
  <div class="rec" style="top:94px">
    <div class="ic"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M8 8h8M8 12h8"/></svg></div>
    <div class="n">GOLDEN.SUN</div>
    <div class="s">8M</div>
  </div>
  <div class="rec" style="top:111px">
    <div class="ic"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M8 8h8M8 12h8"/></svg></div>
    <div class="n">ADVANCE.WARS</div>
    <div class="s">4M</div>
  </div>

  <div class="meter">
    <div class="l"><span>SD 卡 6.2G 可用</span><span>32G · exFAT</span></div>
    <div class="b"><i></i></div>
  </div>

  <div class="hint">
    <span><b>A</b> 打开</span><span><b>B</b> 返回</span><span><b>START</b> 命令</span>
    <span class="r">1.6.2</span>
  </div>

</div></div>
</body></html>
