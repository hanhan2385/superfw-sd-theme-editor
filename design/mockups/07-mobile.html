<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>07 Mobile</title><link rel="stylesheet" href="base.css">
<style>
  html,body{width:390px;height:844px;background:#0A0A08}
  .m{width:390px;height:844px;display:flex;flex-direction:column;position:relative;overflow:hidden}
  .m-h{height:52px;flex:none;display:flex;align-items:center;gap:9px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--panel)}
  .m-h .mark{width:24px;height:24px;border-radius:4px;background:var(--accent);color:#0B0B09;display:grid;place-items:center;font:800 13px/1 var(--mono)}
  .m-h .nm{font-size:13px;font-weight:600;line-height:1.1}
  .m-h .nm small{display:block;font:9px/1.2 var(--mono);color:var(--dim);letter-spacing:.04em}
  .m-h .sp{flex:1}
  .m-h .ic{width:30px;height:30px;border-radius:3px;display:grid;place-items:center;color:var(--muted)}
  .m-h .ic.pri{background:var(--accent);color:#0B0B09}

  .m-stage{flex:1;position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:16px 0 8px;
    background:radial-gradient(90% 60% at 50% 30%,#15150F 0%,#0A0A08 70%)}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(236,232,222,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(236,232,222,.03) 1px,transparent 1px);background-size:20px 20px;mask-image:radial-gradient(60% 50% at 50% 40%,#000,transparent)}
  .m-dev{position:relative;z-index:2}
  .m-bezel{padding:10px;border-radius:7px;background:linear-gradient(180deg,#23231F,#141412);border:1px solid rgba(255,255,255,.1);box-shadow:0 20px 40px -16px #000}
  .m-screen{width:360px;height:240px;overflow:hidden;position:relative;border-radius:2px;box-shadow:0 0 0 1px #000}
  .m-zoom{position:absolute;right:16px;top:14px;z-index:3;display:flex;align-items:center;gap:8px;background:rgba(19,19,17,.85);border:1px solid var(--line-2);border-radius:20px;padding:5px 10px;font:9.5px/1 var(--mono);color:var(--muted);backdrop-filter:blur(6px)}
  .m-hint{margin-top:12px;font:9.5px/1 var(--mono);color:var(--dim);letter-spacing:.04em}

  .film-m{flex:none;display:flex;gap:7px;padding:0 14px 12px;overflow:hidden}
  .fm{width:58px;flex:none}
  .fm .fr{height:38px;border:1px solid var(--line-2);border-radius:2px;background:var(--t-bg);position:relative;overflow:hidden}
  .fm.on .fr{border-color:var(--accent)}
  .fm .c{font-size:8.5px;color:var(--dim);margin-top:4px;text-align:center}
  .fm.on .c{color:var(--text)}

  .chips{flex:none;display:flex;gap:8px;padding:0 14px 12px;align-items:center}
  .chip-c{width:26px;height:26px;border-radius:50%;border:2px solid transparent;position:relative}
  .chip-c.on{border-color:var(--accent);box-shadow:0 0 0 2px rgba(217,255,87,.15)}
  .chips .lbl{font:9px/1 var(--mono);color:var(--dim);margin-left:auto;letter-spacing:.06em}

  .sheet{flex:none;background:var(--panel);border-top:1px solid var(--line-2);border-radius:12px 12px 0 0;padding:6px 14px 0;position:relative;box-shadow:0 -16px 40px rgba(0,0,0,.5)}
  .sheet .grab{width:34px;height:3px;border-radius:2px;background:var(--line-3);margin:2px auto 10px}
  .sh-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .sh-head .sw{width:34px;height:34px;border-radius:3px;background:#6FF2C0;border:1px solid rgba(255,255,255,.2)}
  .sh-head .t{font-size:13px;font-weight:600}
  .sh-head .t small{display:block;font:9px/1.4 var(--mono);color:var(--dim);letter-spacing:.04em}
  .sh-head .more{margin-left:auto;color:var(--dim);font-size:16px}
  .sl{display:grid;grid-template-columns:34px 1fr 34px;gap:8px;align-items:center;height:30px}
  .sl .k{font-size:10px;color:var(--muted)}
  .sl .tr{height:4px;background:var(--panel-3);border-radius:2px;position:relative}
  .sl .tr i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(217,255,87,.15),rgba(217,255,87,.5));border-radius:2px}
  .sl .tr b{position:absolute;top:-5px;width:14px;height:14px;border-radius:50%;background:var(--text);border:2px solid var(--panel);transform:translateX(-7px)}
  .sl .v{font:9.5px/1 var(--mono);color:var(--muted);text-align:right}
  .sheet .cta{margin:10px 0 8px;height:38px;border-radius:4px;background:var(--accent);color:#0B0B09;display:grid;place-items:center;font:600 12px/1 var(--ui)}
  .m-tabs{flex:none;height:56px;display:flex;border-top:1px solid var(--line);background:var(--panel);padding-bottom:6px}
  .m-tabs .t{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--dim);font-size:8.5px}
  .m-tabs .t.on{color:var(--accent)}
  .m-tabs .t svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6}
</style></head><body>
<div class="m">
  <div class="m-h">
    <div class="mark">S</div>
    <div class="nm">Aurora<small>1.6.2 · SD</small></div>
    <div class="sp"></div>
    <div class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 14 4 9l5-5"/><path d="M4 9h9a7 7 0 0 1 0 14h-3"/></svg></div>
    <div class="ic pri"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 21h16"/></svg></div>
  </div>

  <div class="m-stage">
    <div class="grid"></div>
    <div class="m-zoom"><span>1.5×</span><span style="color:var(--line-3)">|</span><span>240×160</span></div>

    <div class="m-dev">
      <div class="m-bezel">
        <div class="m-screen">
          <div style="width:240px;height:160px;transform:scale(1.5);transform-origin:top left">
            <div class="gba">
              <div class="g-tabs">
                <div class="g-tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg></div>
                <div class="g-tab on"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></div>
                <div class="g-tab"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 9h6v6H9z"/></svg></div>
                <div class="g-tab"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/><circle cx="18" cy="17" r="2"/></svg></div>
                <div class="g-tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4c3 4 3 12 0 16"/></svg></div>
                <div class="g-tab"><svg viewBox="0 0 24 24"><path d="M14 6a4 4 0 0 0-4 6l-6 6 2 2 6-6a4 4 0 0 0 6-4l-3 1-2-2z"/></svg></div>
                <div class="g-tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 11v5M12 8h.01"/></svg></div>
              </div>
              <div class="g-body">
                <div class="g-row"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="#8FB3BB" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg><span class="nm">..</span></div>
                <div class="g-row"><svg class="ic" viewBox="0 0 24 24" fill="#6FF2C0"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span class="nm">GAMES</span><span class="sz">41</span></div>
                <div class="g-row"><svg class="ic" viewBox="0 0 24 24" fill="#6FF2C0"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span class="nm">HOMEBREW</span><span class="sz">12</span></div>
                <div class="g-row"><svg class="ic" viewBox="0 0 24 24" fill="#6FF2C0"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span class="nm">EMULATORS</span><span class="sz">5</span></div>
                <div class="g-row"><svg class="ic" viewBox="0 0 24 24" fill="#6FF2C0"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span class="nm">SAVES</span><span class="sz">88</span></div>
                <div class="g-row"><svg class="ic" viewBox="0 0 24 24" fill="#E6F5F7" opacity=".55"><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M8 8h8M8 12h8M8 16h5" stroke="#0E1A21" stroke-width="1.4"/></svg><span class="nm">METROID.ZERO.MISSION.GBA</span><span class="sz">8M</span></div>
                <div class="g-row sel"><svg class="ic" viewBox="0 0 24 24" fill="#E6F5F7"><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M8 8h8M8 12h8M8 16h5" stroke="#0E1A21" stroke-width="1.4"/></svg><span class="nm">MOTHER.3.GBA</span><span class="sz">32M</span></div>
                <div class="g-row"><svg class="ic" viewBox="0 0 24 24" fill="#E6F5F7" opacity=".55"><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M8 8h8M8 12h8M8 16h5" stroke="#0E1A21" stroke-width="1.4"/></svg><span class="nm">GOLDEN.SUN.GBA</span><span class="sz">8M</span></div>
              </div>
              <div class="g-foot"><span>A 载入</span><span>B 返回</span><span style="margin-left:auto">12 / 41</span></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="m-hint">双指缩放 · 单指拖动取色</div>
  </div>

  <div class="film-m">
    <div class="fm"><div class="fr"><div style="position:absolute;left:0;right:0;top:0;height:5px;background:var(--t-surface)"></div><div style="position:absolute;left:3px;top:10px;width:60%;height:3px;background:var(--t-ink);opacity:.5"></div></div><div class="c">Logo</div></div>
    <div class="fm"><div class="fr"><div style="position:absolute;left:0;right:0;top:0;height:5px;background:var(--t-surface)"></div><div style="position:absolute;left:3px;top:10px;width:80%;height:6px;background:var(--t-hi)"></div></div><div class="c">最近</div></div>
    <div class="fm on"><div class="fr"><div style="position:absolute;left:0;right:0;top:0;height:5px;background:var(--t-surface)"></div><div style="position:absolute;left:3px;top:10px;width:86%;height:6px;background:var(--t-hi)"></div><div style="position:absolute;left:3px;top:18px;width:60%;height:3px;background:var(--t-ink);opacity:.4"></div></div><div class="c">浏览</div></div>
    <div class="fm"><div class="fr"><div style="position:absolute;left:0;right:0;top:0;height:5px;background:var(--t-surface)"></div><div style="position:absolute;left:3px;top:10px;width:40%;height:3px;background:var(--t-ink);opacity:.5"></div><div style="position:absolute;left:3px;top:16px;width:55%;height:3px;background:var(--t-ink);opacity:.3"></div></div><div class="c">设置</div></div>
    <div class="fm"><div class="fr"><div style="position:absolute;left:0;right:0;top:0;height:5px;background:var(--t-surface)"></div><div style="position:absolute;left:3px;top:10px;width:70%;height:3px;background:var(--t-ink);opacity:.5"></div></div><div class="c">界面</div></div>
    <div class="fm"><div class="fr"><div style="position:absolute;left:0;right:0;top:0;height:5px;background:var(--t-surface)"></div><div style="position:absolute;left:3px;top:10px;width:50%;height:3px;background:var(--t-ink);opacity:.5"></div></div><div class="c">工具</div></div>
  </div>

  <div class="chips">
    <div class="chip-c" style="background:#0E1A21;border-color:var(--line-3)"></div>
    <div class="chip-c" style="background:#16272F"></div>
    <div class="chip-c" style="background:#E6F5F7"></div>
    <div class="chip-c" style="background:#8FB3BB"></div>
    <div class="chip-c on" style="background:#6FF2C0"></div>
    <div class="chip-c" style="background:#1E3B44"></div>
    <div class="chip-c" style="background:#0A1419;border-color:var(--line-3)"></div>
    <span class="lbl">7 角色</span>
  </div>

  <div class="sheet">
    <div class="grab"></div>
    <div class="sh-head">
      <div class="sw"></div>
      <div class="t">Accent<small>#6FF2C0 · 7 处 · 0x5FAD</small></div>
      <div class="more">···</div>
    </div>
    <div class="sl"><span class="k">色相</span><div class="tr"><i style="width:46%"></i><b style="left:46%"></b></div><span class="v">166°</span></div>
    <div class="sl"><span class="k">饱和</span><div class="tr"><i style="width:78%"></i><b style="left:78%"></b></div><span class="v">78%</span></div>
    <div class="sl"><span class="k">明度</span><div class="tr"><i style="width:88%"></i><b style="left:88%"></b></div><span class="v">88%</span></div>
    <div class="cta">应用到全部 8 个屏幕</div>
  </div>

  <div class="m-tabs">
    <div class="t on"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="1.5"/><path d="M8 21h8M12 17v4"/></svg>画布</div>
    <div class="t"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>资产</div>
    <div class="t"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.4"/><circle cx="18" cy="18" r="2.4"/><path d="M6 8.4v4.1a3.5 3.5 0 0 0 3.5 3.5h6.1"/><path d="M8.4 6h6.1a3.5 3.5 0 0 1 3.5 3.5v6.1"/></svg>行为</div>
    <div class="t"><svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 21h16"/></svg>发布</div>
  </div>
</div>
</body></html>
